# Production deployment: backend + frontend behind Caddy (automatic HTTPS).
# See DEPLOY.md. Set SITE_ADDRESS in a .env file next to this one.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Browser origins allowed to call the API. Defaults to this server's own
      # address; set it to the Vercel URL when the frontend is hosted there.
      APEX_CORS_ORIGINS: ${APEX_CORS_ORIGINS:-https://${SITE_ADDRESS}}
    volumes:
      # Same folder as local development, so a cache built on a laptop can be
      # copied up with rsync and used as-is.
      - ./backend/.apex-cache:/app/.apex-cache

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ""
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env (see deploy.env.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Not on frontend: with the frontend on Vercel, this server runs only
    # `docker compose up -d backend caddy`.
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
